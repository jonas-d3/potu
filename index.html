<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="Spil dagens Potu. Find pladsen til hvert tal og hver farve på et bræt med 4 × 4 eller 5 × 5 felter."
    />
    <link rel="icon" href="./mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Potu · Dagens logikspil</title>
  </head>
  <body>
    <header class="topbar">
      <button class="raised menu-button" data-action="menu">
        <span data-icon="menu"></span>Menu
      </button>
      <div class="toolbar">
        <time id="clock" hidden>0:00</time>
        <button
          class="raised square"
          id="pause"
          data-action="pause"
          aria-label="Sæt spillet på pause"
          title="Pause"
          hidden
        >
          <span data-icon="pause"></span>
        </button>
        <button
          class="raised square"
          data-action="stats"
          aria-label="Statistik"
          title="Statistik"
        >
          <span data-icon="stats"></span>
        </button>
        <button
          class="raised square"
          data-action="rules"
          aria-label="Spilleregler"
          title="Spilleregler"
        >
          <span data-icon="help"></span>
        </button>
        <button
          class="raised square"
          data-action="settings"
          aria-label="Indstillinger"
          title="Indstillinger"
        >
          <span data-icon="settings"></span>
        </button>
      </div>
    </header>
    <main id="main"></main>
    <dialog id="dialog" aria-labelledby="dialog-title" closedby="any">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button class="close" data-action="close" aria-label="Luk">
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
